name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Build, Test & Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Docker Infrastructure
        run: docker compose up -d

      - name: Wait for PostgreSQL Readiness
        run: until docker exec pricepulse-postgres pg_isready -U pricepulse -d pricepulse; do sleep 1; done

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Run Unit Tests
        run: pnpm test

      - name: Run Integration Tests
        run: pnpm test:integration

      - name: Verify Architecture Rules (Dependency Cruiser)
        run: pnpm depcruise

      - name: Build Production Bundle
        run: pnpm build
